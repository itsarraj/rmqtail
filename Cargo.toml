[package]
name = "rmqtail"
version = "0.1.0"
edition = "2021"
description = "A standalone CLI to connect to a RabbitMQ cluster and tail messages from an exchange or queue in real-time"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/rmqtail"
readme = "README.md"
keywords = ["rabbitmq", "amqp", "tail", "cli"]
categories = ["command-line-utilities"]

[dependencies]
lapin = "2.3"
tokio = { version = "1", features = ["full"] }
futures-lite = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
